<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Qlock</title>
  <!-- Надежное подключение шрифта Orbitron с жирным начертанием -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: radial-gradient(circle at center, #111 0%, #000 100%);
      --active-dark: #00ffcc;
    }
    body {
      margin: 0;
      background: var(--bg-dark);
      color: rgba(255, 255, 255, 0.1);
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    .color-select {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--active-dark);
      color: var(--active-dark);
      padding: 0.5rem 1rem;
      border-radius: 10px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: all 0.3s;
    }
    .color-select option {
      background-color: #111;
      color: var(--active-dark);
      padding: 10px;
    }
    .clock {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      grid-gap: 6px;
      max-width: 90vmin;
      width: 90vmin;
    }
    .letter {
      font-size: 3vmin;
      font-weight: 500;
      text-align: center;
      color: rgba(255, 255, 255, 0.1);
      transition: color 0.5s ease, transform 0.5s ease, text-shadow 0.5s ease;
      position: relative;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }
    .letter.on {
      color: var(--active-dark);
      transform: scale(1.2);
      text-shadow: 0 0 12px var(--active-dark);
    }
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,255,204,0.2) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
    }
    .digital-time {
      margin-top: 20px;
      font-size: 4vmin;
      font-weight: 500;
      color: var(--active-dark);
      text-shadow: 0 0 10px var(--active-dark);
    }
    .powered-by {
      margin-top: 10px;git status
      font-size: 2vmin;
      letter-spacing: 2px;
      color: var(--active-dark);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="controls">
    <select class="color-select" onchange="changeColor(this.value)">
      <option value="#00ffcc">Neon Green</option>
      <option value="#007bff">Blue</option>
      <option value="#ff0066">Pink</option>
      <option value="#ffcc00">Amber</option>
      <option value="#00ffaa">Mint</option>
      <option value="#FF0000">Red</option>
      <option value="#FFC0CB">Pink</option>
      <option value="#FF6347">Tomato</option>
      <option value="#FFD700">Gold</option>
      <option value="#FFFF00">Yellow</option>
      <option value="#F0E68C">Khaki</option>
      <option value="#EE82EE">Violet</option>
      <option value="#00FF00">Lime</option>
      <option value="#00FFFF">Aqua</option>
      <option value="#0000FF">Blue</option>
      <option value="#F4A460">SandyBrown</option>
      <option value="#FFFFFF">White</option>
    </select>
  </div>

  <div class="glow"></div>
  <div class="clock" id="clock"></div>
  <div class="digital-time" id="digitalTime"></div>
  <div class="powered-by">CREATOR RS</div>
  <audio id="tickSound" src="https://freesound.org/data/previews/341/341695_6260500-lq.mp3" preload="auto"></audio>

  <!-- Подключаем JavaScript отдельным файлом -->
  <script src="script.js"></script>
</body>
</html>
