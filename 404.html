<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>404 - Page Not Found</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap');

    :root {
      --bg-dark: radial-gradient(circle at center, #111 0%, #000 100%);
      --active-dark: #00ffcc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: rgba(255, 255, 255, 0.4);
      font-family: 'Orbitron', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      text-align: center;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0,255,204,0.15) 0%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    h1 {
      color: var(--active-dark);
      font-size: 6vmin;
      font-weight: 500;
      text-shadow: 0 0 15px var(--active-dark);
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 2.2vmin;
      color: rgba(255, 255, 255, 0.6);
      max-width: 400px;
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .back-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--active-dark);
      color: var(--active-dark);
      padding: 0.8rem 1.8rem;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 1.8vmin;
      text-decoration: none;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    .back-btn:hover {
      background: var(--active-dark);
      color: #000;
      box-shadow: 0 0 20px var(--active-dark);
      transform: scale(1.05);
    }

    .powered-by {
      position: absolute;
      bottom: 20px;
      font-size: 2vmin;
      letter-spacing: 2px;
      color: var(--active-dark);
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      h1 { font-size: 8vw; }
      p { font-size: 4vw; padding: 0 20px; }
      .back-btn { font-size: 4vw; padding: 0.6rem 1.4rem; }
    }
  </style>
</head>

<body>
  <div class="glow"></div>

  <div>
    <h1>404</h1>
    <p>TIME ERROR: The page you were trying to view does not exist in this timeline.</p>
    <a href="index.html" class="back-btn">RETURN TO CLOCK</a>
  </div>

  <div class="powered-by">CREATOR RS</div>
</body>

</html>
<!-- IE needs 512+ bytes: https://docs.microsoft.com/archive/blogs/ieinternals/friendly-http-error-pages -->
